INSERT

// 👤 USERS
(u1:Users {user_id: 201, name: 'Rohit', country: 'India'}),
(u2:Users {user_id: 202, name: 'Aman', country: 'India'}),
(u3:Users {user_id: 203, name: 'Priya', country: 'India'}),
(u4:Users {user_id: 204, name: 'Sneha', country: 'India'}),
(u5:Users {user_id: 205, name: 'Karan', country: 'India'}),
(u6:Users {user_id: 206, name: 'Neha', country: 'India'}),
(u7:Users {user_id: 207, name: 'Arjun', country: 'India'}),
(u8:Users {user_id: 208, name: 'Meera', country: 'India'}),
(u9:Users {user_id: 209, name: 'Rahul', country: 'India'}),
(u10:Users {user_id: 210, name: 'Ananya', country: 'India'}),

// 🧑‍🤝‍🧑 FOLLOWS RELATIONSHIPS (REALISTIC SOCIAL GRAPH)

// Rohit network
(u1)-[:FOLLOWS]->(u2),
(u1)-[:FOLLOWS]->(u3),
(u1)-[:FOLLOWS]->(u4),

// Layer 2 connections
(u2)-[:FOLLOWS]->(u5),
(u2)-[:FOLLOWS]->(u6),

(u3)-[:FOLLOWS]->(u6),
(u3)-[:FOLLOWS]->(u7),

(u4)-[:FOLLOWS]->(u7),
(u4)-[:FOLLOWS]->(u8),

// Cross connections (important for recommendations)
(u5)-[:FOLLOWS]->(u9),
(u6)-[:FOLLOWS]->(u9),
(u7)-[:FOLLOWS]->(u10),
(u8)-[:FOLLOWS]->(u10),

// Mutual loops
(u9)-[:FOLLOWS]->(u1),
(u10)-[:FOLLOWS]->(u2),

// Additional density (more realistic)
(u5)-[:FOLLOWS]->(u6),
(u6)-[:FOLLOWS]->(u7),
(u7)-[:FOLLOWS]->(u8),
(u8)-[:FOLLOWS]->(u5);


MATCH (u:Users {name: 'Rohit'})-[:FOLLOWS]->(f1)-[:FOLLOWS]->(f2)
WHERE f2.name <> 'Rohit'
RETURN DISTINCT f2.name;

// DEMO 2: Find "Influencers" (Most Followers)
// Who has the most followers in the network?
MATCH (follower:Users)-[:FOLLOWS]->(influencer:Users)
RETURN influencer.name, COUNT(follower)
ORDER BY COUNT(follower) DESC;

// DEMO 3: 3rd Degree Connections
// Who is 3 hops away from Rohit? (Friends of friends of friends)
MATCH (u:Users {name: 'Rohit'})-[:FOLLOWS]->(f1)-[:FOLLOWS]->(f2)-[:FOLLOWS]->(f3)
WHERE f3.name <> 'Rohit'
RETURN DISTINCT f3.name;

// DEMO 4: Find "Active Users" (Following the most people)
// Who is following the highest number of other users?
MATCH (u:Users)-[:FOLLOWS]->(followed:Users)
RETURN u.name, COUNT(followed)
ORDER BY COUNT(followed) DESC;

// DEMO 5: Mutual Connections (Common Friends)
// Who do both Aman and Priya follow? (The answer should be Neha)
MATCH (u1:Users {name: 'Aman'})-[:FOLLOWS]->(common:Users)<-[:FOLLOWS]-(u2:Users {name: 'Priya'})
RETURN common.name;

// DEMO 6: Path to Target (2-Hop Distance)
// Who can reach Ananya through exactly one intermediary?
MATCH (u:Users)-[:FOLLOWS]->(intermediary:Users)-[:FOLLOWS]->(target:Users {name: 'Ananya'})
RETURN DISTINCT u.name;

// DEMO 7: Find Social "Cliques" (4-Person Loops)
// Find a closed group of 4 people who all follow each other in a chain.
MATCH (a:Users)-[:FOLLOWS]->(b:Users)-[:FOLLOWS]->(c:Users)-[:FOLLOWS]->(d:Users)-[:FOLLOWS]->(a:Users)
RETURN DISTINCT a.name, b.name, c.name, d.name;

// DEMO 8: Filtering on Properties after Traversal
// Find 2nd-degree connections who are specifically located in India.
MATCH (u:Users {name: 'Rohit'})-[:FOLLOWS]->(f1:Users)-[:FOLLOWS]->(f2:Users)
WHERE f2.country = 'India' AND f2.name <> 'Rohit'
RETURN DISTINCT f2.name;

