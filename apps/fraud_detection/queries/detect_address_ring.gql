// Detect multiple distinct users ordering tickets to the exact same physical address
MATCH (u1:Users), (o1:TicketOrders), (u2:Users), (o2:TicketOrders), (sa:ShippingAddresses)
WHERE u1.user_id = o1.user_id 
  AND u2.user_id = o2.user_id 
  AND o1.address_id = sa.address_id 
  AND o2.address_id = sa.address_id 
  AND u1.name <> u2.name
RETURN sa.address, u1.name, u2.name;
