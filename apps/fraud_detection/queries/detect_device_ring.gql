// Detect multiple distinct users logging in from the same device (e.g. spoofed device)
MATCH (u1:Users), (o1:TicketOrders), (u2:Users), (o2:TicketOrders), (dev:Devices)
WHERE u1.user_id = o1.user_id 
  AND u2.user_id = o2.user_id 
  AND o1.device_id = dev.device_id 
  AND o2.device_id = dev.device_id 
  AND u1.name <> u2.name
RETURN dev.os, u1.name, u2.name;
